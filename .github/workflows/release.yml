name: monthly release

# Keeps the shipped .toc Interface number current and cuts a dated release every
# month. Delivery is the BigWigsMods packager step below: it builds the addon
# zip and uploads it to CurseForge with CF_API_KEY. CurseForge repo integration
# is deliberately not used (no package webhook), so the pushed tag by itself
# deploys nothing -- it exists for the changelog and a versioned GitHub ref. The
# "empty" build (nothing changed but the version) still re-uploads for the live
# client so the addon never shows as out of date.
on:
  schedule:
    - cron: "0 12 1 * *" # 12:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (default: today's date, e.g. 2026.7.24)"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # A step's `if` cannot read `secrets`, so surface the key here and test that.
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager reads past tags to build a changelog
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
      - run: npm test

      - name: Resolve version and current interface
        id: meta
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="$(date -u +%Y.%-m.%-d)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "interface=$(node scripts/current-interface.mjs || true)" >> "$GITHUB_OUTPUT"

      - name: Stamp version and interface, then re-test
        run: |
          node scripts/apply-release.mjs "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.interface }}"
          npm test

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git commit -am "release: ${{ steps.meta.outputs.version }}"
            git push
          fi
          TAG="v${{ steps.meta.outputs.version }}"
          # Idempotent: a re-run after a failed upload must not die on its own
          # tag. If the tag is already on origin, leave it and go straight to the
          # upload -- the tag already points at this same release commit.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already on origin; leaving it in place."
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi

      # Primary delivery: builds the zip and uploads it to CurseForge. If this
      # fails the whole run fails on purpose, so a broken upload is never silent;
      # the tag step above is idempotent, so just re-running the workflow retries
      # the upload cleanly. Guarded on the key only so forks without it don't error.
      - name: Upload to CurseForge
        if: ${{ env.CF_API_KEY != '' }}
        uses: BigWigsMods/packager@master
        with:
          # Show the CurseForge file as "MythicPlusTimerandTools-<version>.zip"
          # instead of the bare version, so the files list reads clearly. The
          # leading ":" leaves the zip filename at its default and overrides only
          # the upload label; the in-zip addon folder (package-as) is untouched.
          args: "-n :{package-name}-{project-version}.zip"
