name: keep-alive release

# Keeps the addon from ever showing as out of date without any manual work, and
# without your computer being on: GitHub runs this in the cloud on a schedule.
#
# What actually makes WoW/CurseForge flag an addon "out of date" is the `##
# Interface:` number in the .toc lagging the live client, not the file's age. So
# the fix is to periodically re-stamp the current Interface and re-upload a file
# for the current patch. This does exactly that.
#
# Cadence: the schedule fires daily, but the `gate` job only lets a release
# through when 30+ days have passed since the last commit. Any commit you make
# (or a release this workflow cuts, which commits the version bump) resets that
# 30-day clock, so releases happen only when the repo has otherwise been idle.
# The 30-day keep-alive commit also keeps the schedule itself alive (GitHub
# suspends cron on repos with 60 days of no activity).
#
# Delivery is the BigWigsMods packager step: it builds the zip and uploads it to
# CurseForge with CF_API_KEY. CurseForge repo integration is deliberately not
# used (no package webhook), so the pushed tag by itself deploys nothing -- it
# exists for the changelog and a versioned GitHub ref.
on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC daily; the gate decides whether to release
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (default: today's date, e.g. 2026.7.24)"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decides whether a release is due. A manual run always passes; a scheduled run
  # passes only when the last commit is at least 30 days old.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to read the last commit's date
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: releasing."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(git log -1 --format=%ct)
          NOW=$(date -u +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Days since last commit: $DAYS"
          if [ "$DAYS" -ge 30 ]; then
            echo "Idle 30+ days: cutting a keep-alive release."
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Recent activity: nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    # A step's `if` cannot read `secrets`, so surface the key here and test that.
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager reads past tags to build a changelog
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
      - run: npm test

      - name: Resolve version and current interface
        id: meta
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="$(date -u +%Y.%-m.%-d)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "interface=$(node scripts/current-interface.mjs || true)" >> "$GITHUB_OUTPUT"

      - name: Stamp version and interface, then re-test
        run: |
          node scripts/apply-release.mjs "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.interface }}"
          npm test

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git commit -am "release: ${{ steps.meta.outputs.version }}"
            git push
          fi
          TAG="v${{ steps.meta.outputs.version }}"
          # Idempotent: a re-run after a failed upload must not die on its own
          # tag. If the tag is already on origin, leave it and go straight to the
          # upload -- the tag already points at this same release commit.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already on origin; leaving it in place."
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi

      # Primary delivery: builds the zip and uploads it to CurseForge. If this
      # fails the whole run fails on purpose, so a broken upload is never silent;
      # the tag step above is idempotent, so just re-running the workflow retries
      # the upload cleanly. Guarded on the key only so forks without it don't error.
      - name: Upload to CurseForge
        if: ${{ env.CF_API_KEY != '' }}
        uses: BigWigsMods/packager@master
        with:
          # Show the CurseForge file as "MythicPlusTimerandTools-<version>.zip"
          # instead of the bare version, so the files list reads clearly. The
          # leading ":" leaves the zip filename at its default and overrides only
          # the upload label; the in-zip addon folder (package-as) is untouched.
          args: "-n :{package-name}-{project-version}.zip"
